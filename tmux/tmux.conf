# Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# General
set -g mouse on
set-window-option -g mode-keys vi
set -g status-keys emacs
set -s escape-time 0
set -g display-time 4000
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on
set -s set-clipboard on

# Keybinds
unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind _ split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind 'c' new-window -c "#{pane_current_path}"
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r m resize-pane -Z
bind C-p previous-window
bind C-n next-window
bind R source-file "./tmux/tmux.conf"

# Disable bell
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# Visuals
set -g default-terminal "xterm-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"
set -g status-interval 5
set -g pane-border-lines heavy
set -g pane-border-style "fg=#726A8A"
set -g pane-active-border-style "fg=#9273ED"
set-option -ag message-style "fg=yellow,bg=#202020,fill=#202020"
set-option -ag message-command-style "fg=yellow,bg=#202020,fill=#202020"
set-option -g popup-style "bg=#202020"
set-option -g popup-border-lines "rounded"
set-option -g popup-border-style "bg=#202020,fg=#565656"
set-option -g tree-mode-border-style "bg=#202020,fg=#565656"

# Status line inspired by tmux-dotbar
# https://github.com/vaaleyard/tmux-dotbar
bg="#202020"
fg="#565656"
fg_current="#E7E7E7"

window_separator_icon=" • "
maximized_pane_icon="󰊓 "
ssh_icon="󰌘"

base_window_format=" #W "
ssh_window_format=" ${ssh_icon} #(host=\$(echo '#{pane_title}' | sed 's/^ssh //; s/ .*//; s/.*@//; s/:.*//'); if echo \"\$host\" | grep -qE '^[0-9.]+\$|^[0-9]'; then echo '#W'; else echo \"\$host\"; fi | cut -c1-20) "
window_status_format="#{?#{==:#{pane_current_command},ssh},${ssh_window_format},${base_window_format}}"
current_format="#[nounderscore,bg=${bg},fg=${fg_current}]${window_status_format}#[bg=${bg},fg=${fg_current}]#{?window_zoomed_flag,${maximized_pane_icon},}#[bg=${bg},fg=${bg}]"

set -g status-left  " [#S] "
set -g status-right " %A • %I:%M %p • %d %B %Y "
set-option -g status-style "bg=${bg},fg=${fg}"
set-option -g status-justify "absolute-centre"
set-option -g window-status-format "${window_status_format}#{?window_zoomed_flag,${maximized_pane_icon},}"
set-option -g window-status-current-format "$current_format"
set-window-option -g window-status-separator "$window_separator_icon"

# Popups for quick actions
bind t display-popup                                                      # Shell
bind g display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "lazygit" # Lazygit
bind b run-shell "tmux capture-pane -S -100 && tmux save-buffer /tmp/tmux-cap" \; display-popup -w 90% -h 90% -E "nvim + /tmp/tmux-cap" # Buffer content

# Plugins
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-continuum"
set -g @plugin "tmux-plugins/tmux-yank"
set -g @plugin "tmux-plugins/tmux-open"
set -g @plugin "christoomey/vim-tmux-navigator"

# Plugin options
set -g @continuum-restore "on"

run "./tmux/plugins/tpm/tpm"
